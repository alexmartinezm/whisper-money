services:
  app:
    image: ${WHISPER_IMAGE:-ghcr.io/whisper-money/whisper-money:latest}
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - whisper-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    # Long enough for supervisor to stop the queue workers in order (see
    # docker/supervisor/supervisord.conf) instead of the default 10s, after which
    # Docker SIGKILLs them mid-poll and every one reports a lost connection.
    stop_grace_period: 150s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - whisper-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  whisper-storage:
  whisper-mysql:
