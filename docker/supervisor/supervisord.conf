[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Two settings below exist for the same reason: a deploy used to leave five
; identical exceptions in the error tracker, one per queue worker, every time.
;
; `priority` fixes the order. Supervisor starts by ascending priority and stops
; by descending, so the dependencies that live in this container get the lowest
; numbers and are the last things standing; the workers get the highest and are
; stopped first. Without it, redis-server died while workers were still reading
; `illuminate:queue:restart` from it and each reported the refused connection.
;
; `stopwaitsecs` on the workers makes the graceful stop real. SIGTERM tells a
; worker to finish the job in hand and exit; the hour it used to be given never
; happened, because Docker SIGKILLs the whole container long before that, which
; is how workers kept dying inside the transaction `pop()` opens. It is paired
; with `stop_grace_period` on the app service in docker-compose.production.yml.

[program:nginx]
command=nginx -g "daemon off;"
priority=100
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.log

[program:php-fpm]
command=php-fpm -F
priority=100
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.log

[program:memcached]
command=memcached -u www-data -m 64 -p 11211 -l 127.0.0.1 -v
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/memcached.log
stderr_logfile=/var/log/memcached.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log

[program:inertia-ssr]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan inertia:start-ssr --runtime=bun'
priority=100
user=www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/worker-inertia-ssr.log
stdout_logfile=/var/log/worker-inertia-ssr.log

[program:queue-worker-emails]
priority=900
process_name=%(program_name)s
command=php /app/artisan queue:work database --queue=emails --sleep=1 --tries=5 --max-time=3600
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/queue-worker-emails.log
stopwaitsecs=120
numprocs=1

[program:queue-worker]
priority=900
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/queue-worker.log
stopwaitsecs=120
numprocs=2

[program:queue-worker-ai]
priority=900
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=ai --sleep=1 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/queue-worker-ai.log
stopwaitsecs=120
numprocs=2

[program:scheduler]
priority=900
process_name=%(program_name)s
command=php /app/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log
stopwaitsecs=60
numprocs=1
